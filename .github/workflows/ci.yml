name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install openpyxl jsonschema pypdfium2
      - name: Extração reprodutível (dados/ commitado == pipeline(fontes/))
        run: |
          python3 pipeline/extrair_qbq.py
          python3 pipeline/extrair_conceitos.py
          python3 pipeline/extrair_cbo.py
          git diff --exit-code dados/
      - run: python3 pipeline/validar_schema.py
      - run: python3 pipeline/validar.py
      - name: Derivados reprodutíveis
        run: |
          python3 pipeline/derivar.py
          git diff --exit-code derivados/csv
      - name: Ativos de release conferem com o manifesto
        # qbq.sql e qbq.sqlite não são versionados; o manifesto é. A linha do
        # qbq.sql é texto gerado por Python puro e determinística, então vale
        # como contrato. A do sqlite não é conferida aqui: a serialização byte
        # a byte depende da versão da libsqlite do runner.
        run: grep 'qbq\.sql$' derivados/MANIFEST.sha256 | sha256sum -c -
